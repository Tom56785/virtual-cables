[package]
name = "virtualcables"
version = "0.0.0-dev"
edition = "2024"
description = "Virtual audio cables exported as USB Audio Class devices over USB/IP"
publish = false
build = "build.rs"

[[bin]]
name = "VirtualCables"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
serde_json = "1.0.154"
socket2 = { version = "0.5", features = ["all"] }
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }

[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target."cfg(not(windows))".dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Networking_WinHttp", "Win32_Security_Cryptography", "Win32_Media", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_UI_Input_KeyboardAndMouse"] }
